name: Build Medialab-Shutdown Timer Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # 1. Download repository
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. Extract ZIP
      # =========================
      - name: Extract project
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force app -ErrorAction SilentlyContinue

          Expand-Archive `
            -Path "PowerTimer-Pro-GitHub-Build.zip" `
            -DestinationPath "app" `
            -Force

          Write-Host "Project extracted successfully."

      # =========================
      # 3. Fix Tauri Rust structure
      # =========================
      - name: Fix Rust source structure
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "app\src-tauri\src" | Out-Null

          if (Test-Path "app\src-tauri\lib.rs") {
            Move-Item `
              -Force `
              "app\src-tauri\lib.rs" `
              "app\src-tauri\src\lib.rs"
          }

          if (Test-Path "app\src-tauri\main.rs") {
            Move-Item `
              -Force `
              "app\src-tauri\main.rs" `
              "app\src-tauri\src\main.rs"
          }

          Write-Host "Rust source structure fixed."

      # =========================
      # 4. Hide Windows console
      # =========================
      - name: Configure Windows GUI
        shell: pwsh
        run: |
          $main = "app\src-tauri\src\main.rs"

          if (Test-Path $main) {

            $content = Get-Content $main -Raw

            if ($content -notmatch "windows_subsystem") {

              $header = '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]'

              $content = $header + "`r`n`r`n" + $content

            }

            Set-Content `
              -Path $main `
              -Value $content `
              -Encoding UTF8
          }

      # =========================
      # 5. Force shutdown command
      # =========================
      - name: Configure forced Windows shutdown
        shell: pwsh
        run: |

          $files = @(
            "app\src-tauri\src\lib.rs",
            "app\src-tauri\src\main.rs",
            "app\src\App.tsx"
          )

          foreach ($file in $files) {

            if (-not (Test-Path $file)) {
              continue
            }

            $content = Get-Content $file -Raw

            # Replace common shutdown commands
            $content = $content -replace `
              'shutdown\s+/s\s+/t\s+\d+', `
              'shutdown.exe /s /f /t 0'

            $content = $content -replace `
              'shutdown\s+/s\s+/t\s+0', `
              'shutdown.exe /s /f /t 0'

            $content = $content -replace `
              'shutdown\.exe\s+/s\s+/t\s+\d+', `
              'shutdown.exe /s /f /t 0'

            Set-Content `
              -Path $file `
              -Value $content `
              -Encoding UTF8
          }

          Write-Host "Forced shutdown configuration applied."

      # =========================
      # 6. Application name
      # =========================
      - name: Configure application name
        shell: pwsh
        run: |

          $configFile = "app\src-tauri\tauri.conf.json"

          if (-not (Test-Path $configFile)) {
            Write-Error "tauri.conf.json not found."
            exit 1
          }

          $config = Get-Content $configFile -Raw | ConvertFrom-Json

          $config.productName = "Medialab-Shutdown Timer"

          $config.identifier = "com.medialab.shutdown.timer"

          if ($config.app.windows.Count -gt 0) {
            $config.app.windows[0].title = "Medialab-Shutdown Timer"
          }

          $config |
            ConvertTo-Json -Depth 30 |
            Set-Content `
              -Path $configFile `
              -Encoding UTF8

          Write-Host "Application name configured."

      # =========================
      # 7. Package name
      # =========================
      - name: Configure package metadata
        shell: pwsh
        run: |

          $packageFile = "app\package.json"

          if (-not (Test-Path $packageFile)) {
            Write-Error "package.json not found."
            exit 1
          }

          $package = Get-Content $packageFile -Raw | ConvertFrom-Json

          $package.name = "medialab-shutdown-timer"

          $package.description = `
            "Medialab-Shutdown Timer - Windows Shutdown Timer"

          $package |
            ConvertTo-Json -Depth 30 |
            Set-Content `
              -Path $packageFile `
              -Encoding UTF8

      # =========================
      # 8. Verify icon
      # =========================
      - name: Verify application icon
        shell: pwsh
        run: |

          $icon = "app\src-tauri\icons\icon.ico"

          if (-not (Test-Path $icon)) {

            Write-Error `
              "Application icon not found: $icon"

            exit 1
          }

          Write-Host "Application icon found."

          Get-Item $icon

      # =========================
      # 9. Setup Node
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22

      # =========================
      # 10. Setup Rust
      # =========================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # =========================
      # 11. Install dependencies
      # =========================
      - name: Install dependencies
        working-directory: app
        shell: pwsh
        run: |

          npm install

      # =========================
      # 12. Build application
      # =========================
      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v1

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:

          projectPath: app

          uploadWorkflowArtifacts: true

          workflowArtifactNamePattern: Medialab-Shutdown-Timer-Windows-[arch]-[bundle]

      # =========================
      # 13. Show generated files
      # =========================
      - name: Show build output
        shell: pwsh
        run: |

          Write-Host "===================================="
          Write-Host "BUILD FINISHED"
          Write-Host "===================================="

          Get-ChildItem `
            "app\src-tauri\target\release\bundle" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
